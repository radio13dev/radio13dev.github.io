<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Radio 13 Games</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Google Fonts: Barlow Semi-Bold -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/resources/css/main.css">
</head>

<body>
    <div class="animated-bg full-page"></div>

    <div class="layout-wrapper">
        
        <!-- Hidden Radio Buttons to track state -->
        <input type="radio" name="nav-group" id="nav-close" class="nav-state">
        <input type="radio" name="nav-group" id="nav-about" class="nav-state">
        <input type="radio" name="nav-group" id="nav-games" class="nav-state">
        <input type="radio" name="nav-group" id="nav-contact" class="nav-state">

        <!-- Left Sidebar Structure (Main Screen on Mobile) -->
        <aside class="sidebar">
            
            <div class="logo-area">
                <!-- Replace with your actual logo asset -->
                <img src="/resources/images/radio13logo.png" alt="RADIO 13" class="logo">
                <div class="logo-text">RADIO 13</div>
            </div>

            <nav class="main-nav">
                <label for="nav-about" class="nav-btn">ABOUT</label>
                <label for="nav-games" class="nav-btn">GAMES</label>
                <label for="nav-contact" class="nav-btn">CONTACT</label>
            </nav>

            <footer class="sidebar-footer">
                <div class="social-links">
                    <!-- Replace with your actual social icon assets -->
                    <a href="#"><img src="/resources/images/youtube.png" alt="YouTube"></a>
                    <a href="#"><img src="/resources/images/instagram.png" alt="Instagram"></a>
                    <a href="#"><img src="/resources/images/facebook.png" alt="Facebook"></a>
                    <a href="#"><img src="/resources/images/x.png" alt="X"></a>
                    <a href="#"><img src="/resources/images/bluesky.svg" alt="Bluesky"></a>
                </div>
                <p class="attribution">Attribution stuff that is really long, etc etc etc etc etc etc etc</p>
            </footer>

        </aside>

        <!-- Right Content Area (Slides in when a radio is checked) -->
        <main class="content-slider">
            
            <!-- Close Button -->
            <label for="nav-close" class="close-btn">&times;</label>

            <div class="content-panel panel-about">
                <h1 class="content-title">Content: About</h1>
                <!-- Your About content goes here -->
                <p>Welcome to the about section.</p>
            </div>

            <div class="content-panel panel-games">
                <h1 class="content-title">Content: Games</h1>
                <!-- Your Games content goes here -->
                <p>Here are our games.</p>
            </div>

            <div class="content-panel panel-contact">
                <h1 class="content-title">Content: Contact</h1>
                <!-- Your Contact content goes here -->
                <p>Get in touch with us.</p>
            </div>

        </main>
        
    </div>

</body>

</html>
